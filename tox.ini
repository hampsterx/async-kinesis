[tox]
envlist = py311,py312,py313,py314,py315,black,mypy

[testenv]
passenv = TESTING_USE_AWS_KINESIS
commands =
    pytest

deps =
    -r test-requirements.txt

[testenv:black]
deps =
    black
commands =
    black --check --diff kinesis
skip_install = true

[testenv:mypy]
deps =
    mypy
commands =
    mypy kinesis
