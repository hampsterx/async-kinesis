name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    services:
      kinesis:
        image: hectorvent/floci:1.5.4
        ports:
          - 4566:4566

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/test-requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test-requirements.txt
        pip install -e .
        sudo apt-get update && sudo apt-get install -y netcat-openbsd redis-tools curl

    - name: Wait for services
      run: |
        # Floci starts in <100ms; wait for port to be available
        timeout 30 bash -c 'until nc -z localhost 4566; do echo "Waiting for Floci..."; sleep 1; done'
        echo "Floci is ready"
        # Wait for Redis
        timeout 60 bash -c 'until redis-cli -h localhost ping; do echo "Waiting for redis..."; sleep 2; done'
        echo "Redis is ready"

    - name: Run tests
      run: |
        timeout 600 pytest -v --cov=kinesis --cov-report=xml --cov-report=term-missing
      env:
        ENDPOINT_URL: http://localhost:4566
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        AWS_DEFAULT_REGION: ap-southeast-2
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # The matrix above resolves the newest compatible releases. This job installs the lowest
  # versions setup.py declares, on the lowest supported Python, so the lower bounds are tested
  # rather than assumed. It uses uv's cache, never the pip cache the matrix restores.
  test-minimum-deps:
    runs-on: ubuntu-latest

    services:
      kinesis:
        image: hectorvent/floci:1.5.4
        ports:
          - 4566:4566

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      EXTRAS: kpl,redis,msgpack,prometheus,dynamodb,cli

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install uv
      run: python -m pip install uv==0.9.26

    # lowest-direct pins only direct requirements to their floors; plain `lowest` also
    # floors transitive packages, some of which no longer build on Python 3.11.
    - name: Install declared minimums, testing extra included
      run: uv pip install --system --resolution lowest-direct -e ".[$EXTRAS,testing]"

    - name: Check declared minimums are installed
      run: python scripts/check_dependency_floors.py --extras "$EXTRAS,testing"

    # The testing extra's floor (pytest 7.0, pytest-asyncio 0.21) is below what this
    # repository's pytest.ini needs, so the pytest plugin tests run with a bare config.
    - name: Run pytest plugin tests at the testing extra's minimums
      run: |
        printf '[pytest]\nasyncio_mode = auto\n' > /tmp/plugin-pytest.ini
        pytest -v --noconftest -c /tmp/plugin-pytest.ini --rootdir . tests/test_testing.py tests/test_mock_producer.py tests/test_mock_consumer.py tests/test_mock_integration.py

    - name: Install test-suite minimums
      run: |
        uv pip install --system --resolution lowest-direct -e ".[$EXTRAS]" -r test-requirements.txt
        sudo apt-get update && sudo apt-get install -y netcat-openbsd redis-tools

    - name: Check declared minimums are still installed
      run: python scripts/check_dependency_floors.py --extras "$EXTRAS"

    - name: Wait for services
      run: |
        timeout 30 bash -c 'until nc -z localhost 4566; do echo "Waiting for Floci..."; sleep 1; done'
        timeout 60 bash -c 'until redis-cli -h localhost ping; do echo "Waiting for redis..."; sleep 2; done'

    - name: Run tests
      run: timeout 600 pytest -v
      env:
        ENDPOINT_URL: http://localhost:4566
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        AWS_DEFAULT_REGION: ap-southeast-2
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test

  test-docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Run tests in Docker
      run: |
        docker compose up --build --abort-on-container-exit --exit-code-from test

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8

    - name: Check code formatting with black
      run: black --check --diff --line-length=120 kinesis tests

    - name: Check import sorting with isort
      run: isort --check-only --diff --line-length=120 kinesis tests

    - name: Lint with flake8
      run: flake8 kinesis tests --max-line-length=120 --extend-ignore=E203,W503,E712,E402,F401,F841,F541
